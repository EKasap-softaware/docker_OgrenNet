name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v7

      - name: GitHub Container Registry'ye giriş yap
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image adını küçük harfe çevir
        id: isim
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker image'ını oluştur ve gönder
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/WebAPI/Dockerfile
          push: true
          tags: |
            ${{ steps.isim.outputs.image }}:latest
            ${{ steps.isim.outputs.image }}:${{ github.sha }}