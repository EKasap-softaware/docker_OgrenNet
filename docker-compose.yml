# ===========================================================================
# Uygulamanın tamamı: WebAPI + PostgreSQL + Redis
#   docker compose up -d --build     -> http://localhost:5000 (Swagger açılır)
# ===========================================================================
services:

  app:
    build:
      context: .
      dockerfile: src/WebAPI/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Username=postgres;Password=postgres;Database=notlar"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      db:
        condition: service_healthy     # Postgres "hazırım" demeden app başlamaz
      redis:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notlar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                       # pg_isready: Postgres bağlantı kabul ediyor mu?
      test: ["CMD-SHELL", "pg_isready -U postgres -d notlar"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
