# Proje köküne "nginx.conf" adıyla kopyala (Bonus B5)

# Docker'ın kendi DNS'i: "app" adını her seferinde yeniden çözer,
# böylece 3 app container'ı arasında sırayla dağıtım yapılır.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location / {
        set $upstream http://app:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
}
