# Bonus B1 + B2 + B3 + B5 + B6 bir arada
# Proje köküne ayrıca ".env" (cozumler/bonus-.env) ve "nginx.conf" (cozumler/bonus-nginx.conf) koy.
# Çalıştırmak için:  docker compose up -d --build --scale app=3

services:
  app:
    build: ./src/NotDefteri
    image: not-defteri:2.0
    # ports YOK -> 3 kopya port çakışması yaşamaz; dışarıya nginx açılır
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Username=${DB_USER};Password=${DB_PASSWORD};Database=${DB_NAME}"  # B1
      ConnectionStrings__Redis: "redis:6379"
      AppName: ${APP_NAME:-Docker Not Defteri (.NET)}   # .env'de yoksa varsayılan değer
      TZ: Europe/Istanbul                                # B6
    restart: unless-stopped                              # B3
    depends_on:
      db:
        condition: service_healthy                       # B2: db gerçekten hazır olunca başla
      redis:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                                         # B2
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nginx:                                                 # B5: yük dengeleyici
    image: nginx:1.27-alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # :ro = salt okunur
    depends_on:
      - app

volumes:
  pgdata:

# Not: app için healthcheck yazmadık, çünkü aspnet image'ında curl/wget yok.
# Yazmak isteseydin ya Dockerfile'a curl kurman ya da küçük bir
# healthcheck programı eklemen gerekirdi. (/health endpoint'i hazır.)
