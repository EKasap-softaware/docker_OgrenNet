services:

  app:
    build:
      context: .
      dockerfile: src/NotDefteri/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Username=postgres;Password=postgres;Database=notlar"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notlar
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata: